
{% extends "base.html" %}

{% block title %}
Login - SNS
{% endblock %}

{% block content %}

<div class="form-container login-container">

    <div class="login-icon"></div>

    <h1>Welcome Back!</h1>

    <p class="form-subtitle">
        Login to access and manage your notes.
    </p>

    <form
        method="POST"
        action="{{ url_for('login') }}"
    >

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>

        <div class="login-forgot-link">
            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>
        </div>

        <button
            type="submit"
            class="btn btn-primary full-width"
        >
            Login →
        </button>

    </form>

    <div class="login-divider"></div>

    <p class="form-footer">
        Don't have an account?
        <a href="{{ url_for('register') }}">
            Register
        </a>
    </p>

</div>

{% endblock %}
