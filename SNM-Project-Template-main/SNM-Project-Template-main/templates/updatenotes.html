
{% extends "base.html" %}

{% block title %}
Edit Notes - SNS
{% endblock %}

{% block navmenu %}
<a href="#">Files</a>
<a href="{{ url_for('mynotes') }}">Notes</a>
<a href="{{ url_for('profile') }}">Profile</a>
<a href="{{ url_for('logout') }}">Logout</a>
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-header">
        <h1>Edit Notes</h1>

        <p>
            Manage and organize all your personal notes in one place.
        </p>

        <p class="form-subtitle">
            Update Your Existing Note
        </p>
    </div>

    <form
        method="POST"
        action="/notes/edit/{{ notes_id }}"
    >

        <div class="form-group">
            <label for="Title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter your note title"
                value="{{ title }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="Content">Content</label>

            <textarea
                id="content"
                name="content"
                rows="6"
                placeholder="Enter your note content"
                required
            >{{ Content }}</textarea>
        </div>

        <button
            type="submit"
            class="btn btn-primary full-width"
        >
            Update Note
        </button>

    </form>

</div>

{% endblock %}
