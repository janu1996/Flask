
{% extends "base.html" %}

{% block title %}
View Notes - SNS
{% endblock %}

{% block navmenu %}
<a href="#">Files</a>
<a href="{{ url_for('mynotes') }}">Notes</a>
<a href="{{ url_for('profile') }}">Profile</a>
<a href="{{ url_for('logout') }}">Logout</a>
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-header">
        <h1>View Notes</h1>

        <p>
            Manage and organize all your personal notes in one place.
        </p>

        <p class="form-subtitle">
            View Your Note for Reference
        </p>
    </div>

    <div class="form-group">
        <label for="Title">Title</label>

        <input
            type="text"
            id="Title"
            name="Title"
            value="{{ title }}"
            readonly
        >
    </div>

    <div class="form-group">
    <label for="Content">Content</label>

    <textarea
        id="Content"
        name="Content"
        rows="6"
        readonly
    >{{ content }}</textarea>
</div>

    <div class="note-actions">

        <a
            href="{{ url_for('mynotes') }}"
            class="btn btn-secondary"
        >
            Back to Notes
        </a>

        <a
            href="/notes/edit/{{ notes_id }}"
            class="btn btn-primary"
        >
            Edit Note
        </a>

    </div>

</div>

{% endblock %}
